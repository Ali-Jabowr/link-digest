name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Verify gate (same script the local Stop hook runs)
        run: ./.claude/verify.sh

  test-guard:
    # Approved tests may only be changed on purpose: fails if committed test
    # code was modified/deleted or skip markers were added, unless a commit in
    # the PR carries a "Test-Change-Approved: <reason>" trailer written by Ali.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./.github/scripts/test-guard.sh "origin/${{ github.base_ref }}"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
