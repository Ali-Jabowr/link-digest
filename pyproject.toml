[project]
name = "link-digest"
version = "0.1.0"
description = "Turn saved video and article links into detailed, cited reports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=18,<19",
    "faster-whisper>=1.2.1",
]

[project.scripts]
link-digest = "link_digest.cli:main"
link-digest-bot = "link_digest.botmain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/link_digest"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis", "pip-audit"]

[tool.ruff.lint]
# Defaults + rules that catch typical AI-code mistakes.
extend-select = [
  "E", "F", "W", "I",   # pycodestyle, pyflakes, imports
  "B",                  # bugbear: likely bugs
  "BLE",                # no blind `except Exception`
  "E722",               # no bare `except:`
  "S",                  # bandit security rules
  "UP", "SIM", "RET", "PT",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "faster_whisper"          # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
